<style>
  html, body { margin: 0; width: 760px; height: 300px; background: transparent; overflow: hidden; }
  .card {
    position: absolute; inset: 0; box-sizing: border-box;
    display: flex; align-items: center; gap: 30px; padding: 30px 40px;
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(9, 13, 21, 0.94), rgba(17, 24, 38, 0.84));
    box-shadow: 0 22px 56px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.09);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    color: #fff;
  }
  .dial { position: relative; width: 168px; height: 168px; flex: none; }
  .dial svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .dial .value {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 54px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .body { min-width: 0; }
  .kicker {
    font-size: 17px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    opacity: 0.62;
  }
  .headline {
    margin-top: 10px; font-size: 42px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rule { margin-top: 18px; height: 4px; border-radius: 2px; transform-origin: left center; }
</style>

<div class="card">
  <div class="dial">
    <svg viewBox="0 0 168 168" aria-hidden="true">
      <circle cx="84" cy="84" r="72" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="12" />
      <circle id="arc" cx="84" cy="84" r="72" fill="none" stroke-width="12" stroke-linecap="round" />
    </svg>
    <div class="value" id="value">0</div>
  </div>
  <div class="body">
    <div class="kicker" id="kicker">KICKER</div>
    <div class="headline" id="headline">Headline</div>
    <div class="rule" id="rule"></div>
  </div>
</div>

<script>
  // Ridge Callout — a count-up dial. Every visible state is a closed form of
  // `t`, so the harness can seek anywhere in any order: the arc length, the
  // number and the rule's scale are all read off the same eased progress.
  const CIRCUMFERENCE = 2 * Math.PI * 72;
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);

  motif.define({
    async setup(props, ctx) {
      document.getElementById('kicker').textContent = props.kicker;
      document.getElementById('headline').textContent = props.headline;
      const arc = document.getElementById('arc');
      arc.setAttribute('stroke', props.accent);
      arc.setAttribute('stroke-dasharray', String(CIRCUMFERENCE));
      const rule = document.getElementById('rule');
      rule.style.background = `linear-gradient(90deg, ${props.accent}, ${props.accent}00)`;
      this.total = props.value;
      this.sweep = Math.min(1.2, ctx.duration * 0.55);
      await document.fonts.ready;
    },
    frame(t) {
      const p = easeOut(Math.min(1, Math.max(0, t / this.sweep)));
      document.getElementById('arc').setAttribute(
        'stroke-dashoffset',
        String(CIRCUMFERENCE * (1 - p)),
      );
      document.getElementById('value').textContent = String(Math.round(this.total * p));
      document.getElementById('rule').style.transform = `scaleX(${p})`;
    },
  });
</script>
